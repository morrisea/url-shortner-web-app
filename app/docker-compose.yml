  #   depends_on:
  #     - database

  client:
    build:
      context: ./client
    volumes:
    - ./client:/app
    - /app/node_modules
    environment:
      CLIENT_PORT: ${CLIENT_PORT}
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    # depends_on:
    #   - server

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:${MYSQL_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/milestone1.sql:/docker-entrypoint-initdb.d/milestone1.sql

volumes:
  mysql_data: