services:
  server:
    build:
      context: ./server
    ports:
      - '${SERVER_PORT}:3000'
    environment:
      API_URL: ${API_URL}
      NODE_ENV: ${NODE_ENV}
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_VALIDATION_SECRET: ${SMTP_VALIDATION_SECRET}
      SMTP_VALIDATION_TTL: ${SMTP_VALIDATION_TTL}
      MFA_TTL: ${MFA_TTL}
      FRONTEND_URL: ${FRONTEND_URL}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET}
    depends_on:
      - database
    volumes:
      - ./server:/workspace
      - /workspace/node_modules

  client:
    build:
      context: ./client
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      CLIENT_PORT: ${CLIENT_PORT}
      VITE_API_URL: ${VITE_API_URL}
      VITE_REDIRECT_URL: ${VITE_REDIRECT_URL}
      VITE_SITE_KEY: ${VITE_SITE_KEY_LOCAL}
    ports:
      - '${CLIENT_PORT}:${CLIENT_PORT}'
    depends_on:
      - server

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '${MYSQL_PORT}:${MYSQL_PORT}'
    volumes:
      - mysql_data:/var/lib/mysql
      # - ./database/milestone1.sql:/docker-entrypoint-initdb.d/milestone1.sql

  adminer:
    image: adminer
    restart: always
    ports:
      - ${ADMINER_PORT}:8080
    depends_on:
      - database

volumes:
  mysql_data:
